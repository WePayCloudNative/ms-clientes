server:
    port: ${SERVER_PORT:8083}
    error:
        # Envía el motivo de los 400 (por ejemplo, teléfono inválido) al BFF
        include-message: always
spring:
    application:
        name: ms-clientes
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: ${JPA_DDL_AUTO:update}
    # En AWS: Oracle en RDS (DB_URL, DB_USER, DB_PASSWORD desde el .env de la EC2).
    # Sin esas variables (desarrollo local) usa H2 en memoria.
    # Hibernate detecta el tipo de base solo, por eso no se fija el dialecto.
    datasource:
        url: ${DB_URL:jdbc:h2:mem:msclientes;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
        username: ${DB_USER:sa}
        password: ${DB_PASSWORD:}
    h2:
        console:
            enabled: true
app:
    admin-oid: ${APP_ADMIN_OID:32a7ca6e-5a16-4dd0-9cc5-7ad24350eca3}
